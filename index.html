<!DOCTYPE html>
<html dir="rtl" lang="ar">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AI Creator Hub - أدوات الذكاء الاصطناعي</title>
    <style>
        body { font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; background-color: #f0f2f5; color: #333; margin: 0; padding: 0; text-align: center; }
        header { background-color: #1a252f; color: #fff; padding: 30px 20px; box-shadow: 0 4px 6px rgba(0,0,0,0.1); }
        h1 { margin: 0; font-size: 28px; color: #00d2ff; }
        p { font-size: 16px; margin-top: 10px; opacity: 0.9; }
        .container { padding: 30px 20px; display: flex; flex-direction: column; align-items: center; }
        .tool-card { background: white; margin: 15px 0; padding: 25px; border-radius: 12px; box-shadow: 0 5px 15px rgba(0,0,0,0.05); width: 90%; max-width: 400px; border-top: 4px solid #00d2ff; transition: transform 0.3s ease; }
        .tool-card:active { transform: scale(0.98); }
        .tool-card h2 { margin: 0 0 10px; font-size: 22px; color: #2c3e50; }
        .tool-card p { color: #7f8c8d; font-size: 15px; margin-bottom: 20px; }
        .btn { display: inline-block; padding: 12px 25px; background-color: #00d2ff; color: #1a252f; text-decoration: none; border-radius: 8px; font-weight: bold; width: 80%; }
    </style>
</head>
<body>
    <header>
        <h1>AI Creator Hub 🚀</h1>
        <p>دليلك السريع لأفضل أدوات الذكاء الاصطناعي لصناع المحتوى</p>
    </header>
    
    <div class="container">
        <!-- الأداة الأولى -->
        <div class="tool-card">
            <h2>🎬 مولّد أفكار Shorts</h2>
            <p>أفكار فيديوهات قصيرة تريند ومناسبة لمحتواك</p>
            <a href="#" class="btn">قريباً..</a>
        </div>

        <!-- الأداة الثانية -->
        <div class="tool-card">
            <h2>📝 مولّد وصف يوتيوب</h2>
            <p>اكتب وصف احترافي متوافق مع الـ SEO يجيب مشاهدات</p>
            <a href="#" class="btn">قريباً..</a>
        </div>
    </div>
</body>
</html>
